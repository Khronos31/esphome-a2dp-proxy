name: Build

on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Check version synchronization
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            python tools/release_version.py check --tag "$GITHUB_REF_NAME"
          else
            python tools/release_version.py check
          fi
      - name: Run source contract tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

  compile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: minimum
            package: esphome==2026.7.4
          - label: current
            package: esphome
    name: ESPHome ${{ matrix.label }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install ESPHome
        run: python -m pip install "${{ matrix.package }}"
      - name: Compile fixture
        run: esphome compile tests/compile.yaml

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - contract
      - compile
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Publish source-only GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          --verify-tag
          --generate-notes
          --title "ESPHome A2DP Proxy $GITHUB_REF_NAME"
