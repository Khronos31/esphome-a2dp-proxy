substitutions:
  name: a2dp-proxy-ci
  friendly_name: A2DP Proxy CI

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.7.4

esp32:
  board: esp-wrover-kit
  flash_size: 8MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_BT_ALLOCATION_FROM_SPIRAM_FIRST: y
    advanced:
      minimum_chip_revision: "3.1"

psram:

external_components:
  - source:
      type: local
      path: ../components
    components: [a2dp_source]

logger:

wifi:
  ssid: build-test
  password: build-test-password
  power_save_mode: none

api:
  encryption:
    key: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

ota:
  - platform: esphome
    password: build-test-password

speaker:
  - platform: a2dp_source
    id: a2dp_output
    target_address: "00:11:22:33:44:55"
    buffer_duration: 750ms

  - platform: resampler
    id: a2dp_resampled
    output_speaker: a2dp_output
    bits_per_sample: 16
    sample_rate: 44100
    buffer_duration: 200ms
    task_stack_in_psram: true

media_player:
  - platform: speaker
    id: a2dp_media_player
    name: Bluetooth Speaker
    buffer_size: 400000
    task_stack_in_psram: true
    volume_initial: 50%
    announcement_pipeline:
      speaker: a2dp_resampled
      format: NONE
