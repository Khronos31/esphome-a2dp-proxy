substitutions:
  name: a2dp-proxy-ci
  friendly_name: A2DP Proxy CI

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.7.4

esp32:
  board: esp-wrover-kit
  flash_size: 8MB
  framework:
    type: esp-idf
    advanced:
      minimum_chip_revision: "3.1"

psram:

external_components:
  - source:
      type: local
      path: ../components
    components: [a2dp_source]

logger:
  logs:
    esp-idf: NONE

wifi:
  ssid: build-test
  password: build-test-password
  power_save_mode: none

api:
  encryption:
    key: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

ota:
  - platform: esphome
    password: build-test-password

speaker:
  - platform: a2dp_source
    id: a2dp_output
    target_address: "00:11:22:33:44:55"
    max_bitpool: 32
    buffer_duration: 750ms

media_player:
  - platform: speaker
    id: a2dp_media_player
    name: Bluetooth Speaker
    buffer_size: 400000
    volume_initial: 50%
    announcement_pipeline:
      speaker: a2dp_output
      format: MP3
      sample_rate: 22050
      num_channels: 1

sensor:
  - platform: wifi_signal
    name: Wi-Fi RSSI
    update_interval: 5s
  - platform: template
    name: A2DP buffer level
    unit_of_measurement: ms
    update_interval: 5s
    lambda: return id(a2dp_output).get_buffer_level_ms();
  - platform: template
    name: A2DP recent silence
    unit_of_measurement: "%"
    update_interval: 5s
    lambda: return id(a2dp_output).take_recent_silence_percent();
  - platform: template
    name: A2DP underflow events
    accuracy_decimals: 0
    update_interval: 5s
    lambda: return id(a2dp_output).get_underflow_events();

binary_sensor:
  - platform: template
    name: A2DP connected
    lambda: return id(a2dp_output).is_a2dp_connected();

text_sensor:
  - platform: wifi_info
    ip_address:
      name: IP address
    bssid:
      name: Wi-Fi BSSID
